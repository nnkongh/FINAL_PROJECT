name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Check secrets
        run: |
          echo "Username length: ${#USERNAME}"
          echo "Token length: ${#TOKEN}"
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          dotnet publish project.Presentation/project.Presentation.csproj -c Release -o ./publish
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapi:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapi:latest
